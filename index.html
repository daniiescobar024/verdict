<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verdict — Web performance audits that speak business</title>
    <meta
      name="description"
      content="Run a Google Lighthouse audit on any website and get a verdict in plain business language: speed, accessibility, SEO and what to fix first."
    />
    <meta name="theme-color" content="#0d0c0a" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Verdict — Web performance audits that speak business" />
    <meta
      property="og:description"
      content="Lighthouse audits translated into what a business owner cares about."
    />
    <meta property="og:url" content="https://verdict-brown-three.vercel.app/" />
    <meta property="og:image" content="https://verdict-brown-three.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Verdict home page: Know what your website is costing you." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      try {
        var t = localStorage.getItem('verdict:theme');
        t = t
          ? JSON.parse(t)
          : matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark';
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
